name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify API
        run: npm run check -w apps/api

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WEBHOOK_URL_ENCRYPTION_KEY: ${{ secrets.WEBHOOK_URL_ENCRYPTION_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY_SECRET: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY_VAR: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          required_secrets=(
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_API_TOKEN
            SUPABASE_URL
            SUPABASE_SERVICE_ROLE_KEY
            WEBHOOK_URL_ENCRYPTION_KEY
          )

          missing=0
          for key in "${required_secrets[@]}"; do
            if [ -z "${!key}" ]; then
              echo "::error::$key must be configured as a production environment secret."
              missing=1
            fi
          done
          if [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY_SECRET" ] && [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY_VAR" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY must be configured as a production environment secret or variable."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Resolve deployment config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WEBHOOK_URL_ENCRYPTION_KEY: ${{ secrets.WEBHOOK_URL_ENCRYPTION_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY_SECRET: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY_VAR: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const read = (path) => fs.readFileSync(path, "utf8");
          const requireTomlString = (source, key, file) => {
            const match = source.match(new RegExp(`^\\s*${key}\\s*=\\s*"([^"]+)"`, "m"));
            if (!match) throw new Error(`${key} is missing in ${file}.`);
            return match[1];
          };
          const stripJsonComments = (source) => {
            let result = "";
            let inString = false;
            let quote = "";
            let escaped = false;
            for (let i = 0; i < source.length; i++) {
              const char = source[i];
              const next = source[i + 1];
              if (inString) {
                result += char;
                if (escaped) {
                  escaped = false;
                } else if (char === "\\\\") {
                  escaped = true;
                } else if (char === quote) {
                  inString = false;
                }
                continue;
              }
              if (char === "\"" || char === "'") {
                inString = true;
                quote = char;
                result += char;
                continue;
              }
              if (char === "/" && next === "/") {
                while (i < source.length && source[i] !== "\n") i++;
                result += "\n";
                continue;
              }
              if (char === "/" && next === "*") {
                i += 2;
                while (i < source.length && !(source[i] === "*" && source[i + 1] === "/")) i++;
                i++;
                continue;
              }
              result += char;
            }
            return result;
          };

          (async () => {
            const apiConfigFile = "apps/api/wrangler.toml";
            const webConfigFile = "apps/web/wrangler.jsonc";
            const apiConfig = read(apiConfigFile);
            const webConfig = JSON.parse(stripJsonComments(read(webConfigFile)));
            const apiWorkerName = requireTomlString(apiConfig, "name", apiConfigFile);
            const queueName = requireTomlString(apiConfig, "queue", apiConfigFile);
            const webWorkerName = webConfig.name;
            if (!webWorkerName) throw new Error(`name is missing in ${webConfigFile}.`);

            const subdomainResponse = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/subdomain`,
              { headers: { authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } }
            );
            const subdomainPayload = await subdomainResponse.json();
            if (!subdomainResponse.ok || !subdomainPayload.success || !subdomainPayload.result?.subdomain) {
              throw new Error(`Unable to resolve Cloudflare workers.dev subdomain: ${JSON.stringify(subdomainPayload)}`);
            }

            const publicSupabaseKey =
              process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY_SECRET ||
              process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY_VAR;
            const publicApiUrl = `https://${apiWorkerName}.${subdomainPayload.result.subdomain}.workers.dev`;

            webConfig.vars = {
              ...(webConfig.vars || {}),
              NEXT_PUBLIC_SUPABASE_URL: process.env.SUPABASE_URL,
              NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: publicSupabaseKey,
              NEXT_PUBLIC_SUPABASE_ANON_KEY: publicSupabaseKey,
              NEXT_PUBLIC_HOOKGATE_API_URL: publicApiUrl
            };

            const secrets = {
              SUPABASE_URL: process.env.SUPABASE_URL,
              SUPABASE_SERVICE_ROLE_KEY: process.env.SUPABASE_SERVICE_ROLE_KEY,
              WEBHOOK_URL_ENCRYPTION_KEY: process.env.WEBHOOK_URL_ENCRYPTION_KEY
            };

            fs.writeFileSync(`${process.env.RUNNER_TEMP}/worker-secrets.json`, JSON.stringify(secrets));
            fs.writeFileSync("apps/web/wrangler.generated.jsonc", `${JSON.stringify(webConfig, null, 2)}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, [
              `API_WORKER_NAME=${apiWorkerName}`,
              `WEB_WORKER_NAME=${webWorkerName}`,
              `QUEUE_NAME=${queueName}`,
              `NEXT_PUBLIC_SUPABASE_URL=${process.env.SUPABASE_URL}`,
              `NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${publicSupabaseKey}`,
              `NEXT_PUBLIC_SUPABASE_ANON_KEY=${publicSupabaseKey}`,
              `NEXT_PUBLIC_HOOKGATE_API_URL=${publicApiUrl}`
            ].join("\n") + "\n");
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Ensure Cloudflare Queue
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          queues="$(npx wrangler queues list --cwd apps/api)"
          if ! printf "%s\n" "$queues" | grep -F "$QUEUE_NAME" >/dev/null; then
            npx wrangler queues create "$QUEUE_NAME" --cwd apps/api
          fi

      - name: Upload Worker secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler secret bulk "$RUNNER_TEMP/worker-secrets.json" --cwd apps/api

      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --secrets-file "${{ runner.temp }}/worker-secrets.json"

      - name: Build Web Worker
        run: npm run build:cloudflare -w apps/web

      - name: Deploy Web Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy --config wrangler.generated.jsonc
